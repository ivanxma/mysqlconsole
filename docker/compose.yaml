name: dbconsole

services:
  dbconsole:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dbconsole:local
    ports:
      - "8080:8080"
    environment:
      DBCONSOLE_RUNTIME_DIR: /run/dbconsole
      DBCONSOLE_STATE_DIR: /var/lib/dbconsole
      DBCONSOLE_LISTENER_SCHEME: http
      DBCONSOLE_SESSION_COOKIE_SECURE: "0"
      DBCONSOLE_DEPLOYMENT_MODE: docker
      DBCONSOLE_OBJECT_STORAGE_AUTH_MODE: oci_config_then_instance_principal
      DBCONSOLE_LOCAL_MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      OCI_CONFIG_FILE: /var/lib/dbconsole/oci-config/config
      DBCONSOLE_OCI_CONFIG_DIR: /var/lib/dbconsole/oci-config
      OCI_CONFIG_PROFILE: ${OCI_CONFIG_PROFILE:-DEFAULT}
    volumes:
      - dbconsole-state:/var/lib/dbconsole
      - dbconsole-mysql-socket:/var/run/mysqld
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:innovation
    command: ["mysqld", "--skip-networking", "--skip-mysqlx"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DBCONSOLE_LOCAL_ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - dbconsole-mysql:/var/lib/mysql
      - dbconsole-mysql-socket:/var/run/mysqld
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --socket=/var/run/mysqld/mysqld.sock -uroot -p$$MYSQL_ROOT_PASSWORD --silent ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  dbconsole-state:
  dbconsole-mysql:
  dbconsole-mysql-socket:
